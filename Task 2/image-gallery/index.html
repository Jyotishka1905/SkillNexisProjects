<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Interactive Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <h1>My Image Gallery</h1>
        <p>Explore my collection of beautiful images</p>
    </header>


    <!-- Gallery -->
    <main>
        <section class="gallery">

            <div class="gallery-item">
                <img src="images/image1.jpg" alt="Gallery Image 1">
            </div>

            <div class="gallery-item">
                <img src="images/image2.jpg" alt="Gallery Image 2">
            </div>

            <div class="gallery-item">
                <img src="images/image3.jpg" alt="Gallery Image 3">
            </div>

            <div class="gallery-item">
                <img src="images/image4.jpg" alt="Gallery Image 4">
            </div>

            <div class="gallery-item">
                <img src="images/image5.jpg" alt="Gallery Image 5">
            </div>

            <div class="gallery-item">
                <img src="images/image6.jpg" alt="Gallery Image 6">
            </div>

            <div class="gallery-item">
                <img src="images/image7.jpg" alt="Gallery Image 7">
            </div>

            <div class="gallery-item">
                <img src="images/image8.jpg" alt="Gallery Image 8">
            </div>

            <div class="gallery-item">
                <img src="images/image9.jpg" alt="Gallery Image 9">
            </div>

            <div class="gallery-item">
                <img src="images/image10.jpg" alt="Gallery Image 10">
            </div>

        </section>
    </main>


    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">

        <button id="closeBtn" class="close-btn" aria-label="Close">
            &times;
        </button>

        <button id="prevBtn" class="nav-btn prev-btn" aria-label="Previous image">
            &#10094;
        </button>

        <img id="lightboxImage" src="" alt="Large gallery image">

        <button id="nextBtn" class="nav-btn next-btn" aria-label="Next image">
            &#10095;
        </button>

    </div>


    <!-- Footer -->
    <footer>
        <p>&copy; 2026 My Image Gallery</p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
