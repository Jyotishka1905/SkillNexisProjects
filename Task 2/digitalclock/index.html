<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Clock & Countdown</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Digital Clock -->

        <section class="clock-box">

            <h1>Digital Clock</h1>

            <div id="clock">
                00:00:00
            </div>

            <p id="date">
                Loading date...
            </p>

        </section>


        <!-- Countdown -->

        <section class="countdown-box">

            <h2>Countdown to New Year</h2>

            <div class="countdown">

                <div class="time-box">
                    <span id="days">00</span>
                    <small>Days</small>
                </div>

                <div class="time-box">
                    <span id="hours">00</span>
                    <small>Hours</small>
                </div>

                <div class="time-box">
                    <span id="minutes">00</span>
                    <small>Minutes</small>
                </div>

                <div class="time-box">
                    <span id="seconds">00</span>
                    <small>Seconds</small>
                </div>

            </div>

        </section>

    </main>


    <footer>
        <p>&copy; 2026 Digital Clock Project</p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
