<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Management Dashboard</h1>
        <p>Manage student records easily</p>
    </header>


    <main class="container">

        <!-- =========================
             STUDENT FORM
             ========================= -->

        <section class="form-section">

            <h2 id="formTitle">Add Student</h2>

            <form id="studentForm">

                <input
                    type="hidden"
                    id="studentId"
                >

                <div class="form-grid">

                    <div class="form-group">
                        <label for="name">
                            Student Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter student name"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter email"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="course">
                            Course
                        </label>

                        <select id="course" required>

                            <option value="">
                                Select Course
                            </option>

                            <option value="BCA">
                                BCA
                            </option>

                            <option value="B.Tech">
                                B.Tech
                            </option>

                            <option value="MCA">
                                MCA
                            </option>

                            <option value="M.Tech">
                                M.Tech
                            </option>

                        </select>
                    </div>


                    <div class="form-group">
                        <label for="gender">
                            Gender
                        </label>

                        <select id="gender" required>

                            <option value="">
                                Select Gender
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>
                    </div>


                    <div class="form-group">
                        <label for="age">
                            Age
                        </label>

                        <input
                            type="number"
                            id="age"
                            placeholder="Enter age"
                            min="1"
                            max="100"
                            required
                        >
                    </div>

                </div>


                <div class="form-buttons">

                    <button
                        type="submit"
                        id="submitBtn"
                    >
                        Add Student
                    </button>

                    <button
                        type="button"
                        id="cancelBtn"
                        class="cancel-btn"
                        style="display: none;"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </section>


        <!-- =========================
             SEARCH & FILTER
             ========================= -->

        <section class="filter-section">

            <input
                type="text"
                id="searchInput"
                placeholder="Search by name or email..."
            >


            <select id="courseFilter">

                <option value="All">
                    All Courses
                </option>

                <option value="BCA">
                    BCA
                </option>

                <option value="B.Tech">
                    B.Tech
                </option>

                <option value="MCA">
                    MCA
                </option>

                <option value="M.Tech">
                    M.Tech
                </option>

            </select>


            <select id="genderFilter">

                <option value="All">
                    All Genders
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </section>


        <!-- =========================
             STUDENT COUNT
             ========================= -->

        <div class="student-count">

            Total Students:
            <strong id="studentCount">
                0
            </strong>

        </div>


        <!-- =========================
             STUDENT TABLE
             ========================= -->

        <section class="table-section">

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Name</th>

                            <th>Email</th>

                            <th>Age</th>

                            <th>Gender</th>

                            <th>Course</th>

                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="studentTableBody">

                        <!-- Students will be added here -->

                    </tbody>

                </table>

            </div>


            <p
                id="noStudents"
                class="no-students"
            >
                No students found.
            </p>

        </section>

    </main>


    <footer>

        <p>
            &copy; 2026 Student Management Dashboard
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
