<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Amazon - E-Commerce Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HEADER
         ========================= -->

    <header>

        <div class="navbar">

            <div class="logo">
                Mini<span>Amazon</span>
            </div>


            <div class="search-container">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search products..."
                >

                <button id="searchBtn">
                    🔍
                </button>

            </div>


            <button
                class="cart-button"
                id="cartButton"
            >
                🛒 Cart
                <span id="cartCount">0</span>
            </button>

        </div>

    </header>


    <!-- =========================
         MAIN
         ========================= -->

    <main>

        <section class="hero">

            <div>

                <h1>
                    Welcome to Mini Amazon
                </h1>

                <p>
                    Find your favorite products at great prices.
                </p>

                <button
                    class="shop-btn"
                    onclick="scrollToProducts()"
                >
                    Shop Now
                </button>

            </div>

        </section>


        <!-- =========================
             PRODUCTS
             ========================= -->

        <section
            class="products-section"
            id="productsSection"
        >

            <div class="section-title">

                <h2>
                    Popular Products
                </h2>

                <select id="categoryFilter">

                    <option value="All">
                        All Categories
                    </option>

                    <option value="Electronics">
                        Electronics
                    </option>

                    <option value="Fashion">
                        Fashion
                    </option>

                    <option value="Home">
                        Home
                    </option>

                    <option value="Accessories">
                        Accessories
                    </option>

                </select>

            </div>


            <div
                id="productGrid"
                class="product-grid"
            >
                <!-- Products created using JavaScript -->
            </div>


            <p
                id="noProducts"
                class="no-products"
            >
                No products found.
            </p>

        </section>

    </main>


    <!-- =========================
         PRODUCT DETAILS POPUP
         ========================= -->

    <div
        id="productModal"
        class="modal"
    >

        <div class="modal-content">

            <button
                class="close-btn"
                id="closeModal"
            >
                &times;
            </button>

            <img
                id="modalImage"
                src=""
                alt="Product"
            >

            <div class="modal-details">

                <h2 id="modalTitle">
                    Product Name
                </h2>

                <p
                    id="modalCategory"
                    class="modal-category"
                >
                    Category
                </p>

                <p
                    id="modalDescription"
                    class="modal-description"
                >
                    Product description
                </p>

                <h3 id="modalPrice">
                    ₹0
                </h3>

                <button
                    id="modalCartBtn"
                    class="add-cart-btn"
                >
                    Add to Cart
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         CART SIDEBAR
         ========================= -->

    <div
        id="cartSidebar"
        class="cart-sidebar"
    >

        <div class="cart-header">

            <h2>
                Your Cart
            </h2>

            <button
                id="closeCart"
                class="close-cart"
            >
                &times;
            </button>

        </div>


        <div
            id="cartItems"
            class="cart-items"
        >
            <!-- Cart items -->
        </div>


        <div class="cart-footer">

            <div class="cart-total">

                <span>
                    Total:
                </span>

                <strong id="cartTotal">
                    ₹0
                </strong>

            </div>

            <button
                id="checkoutBtn"
                class="checkout-btn"
            >
                Proceed to Checkout
            </button>

        </div>

    </div>


    <!-- Overlay -->

    <div
        id="overlay"
        class="overlay"
    ></div>


    <!-- =========================
         FOOTER
         ========================= -->

    <footer>

        <p>
            &copy; 2026 Mini Amazon | E-Commerce Project
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
